<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" aria-label="Pterodactyl">
  <defs>
    <linearGradient id="pteroWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pteroBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pteroBeak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Wings (Left & Right outstretched leathery wings) -->
  <path d="M 4 28 C 10 16, 22 18, 28 26 C 24 36, 14 38, 4 28 Z" fill="url(#pteroWing)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 60 28 C 54 16, 42 18, 36 26 C 40 36, 50 38, 60 28 Z" fill="url(#pteroWing)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wing finger bones / struts -->
  <path d="M 28 26 Q 16 20 6 27" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 36 26 Q 48 20 58 27" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Body & Tail -->
  <ellipse cx="32" cy="38" rx="7" ry="12" fill="url(#pteroBody)" stroke="#065f46" stroke-width="2"/>
  <path d="M 30 50 L 32 58 L 34 50 Z" fill="#047857"/>
  <!-- Little feet / claws -->
  <path d="M 29 49 L 26 55 M 35 49 L 38 55" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M 30 30 L 30 20 L 34 20 L 34 30 Z" fill="url(#pteroBody)"/>
  <!-- Head & Cranial Crest pointing backwards-up -->
  <path d="M 32 20 Q 22 10 18 12 Q 26 18 30 22 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="32" cy="20" r="5" fill="url(#pteroBody)"/>
  <path d="M 34 18 L 48 22 L 34 25 Z" fill="url(#pteroBeak)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Cute friendly Eye -->
  <circle cx="33" cy="19" r="1.8" fill="#ffffff"/>
  <circle cx="33.6" cy="19" r="1" fill="#0f172a"/>
</svg>
