<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bkDeskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Frame & Legs -->
  <line x1="14" y1="32" x2="11" y2="58" stroke="#4b5563" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="53" y2="58" stroke="#4b5563" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Storage Book Box / Cubby under desk -->
  <rect x="12" y="28" width="40" height="12" rx="3" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="16" y="32" width="32" height="5" rx="1.5" fill="#111827"/>
  <!-- Desktop Surface -->
  <rect x="5" y="18" width="54" height="11" rx="3" fill="url(#bkDeskTop)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Pencil Groove -->
  <rect x="12" y="21" width="22" height="2" rx="1" fill="#b45309" opacity="0.7"/>
</svg>
