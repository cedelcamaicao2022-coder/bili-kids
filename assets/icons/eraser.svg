<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bkEraserPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bkEraserBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-25 32 32)">
    <!-- Blue half (hard pencil eraser) -->
    <path d="M 12 22 L 32 22 L 32 42 L 12 42 Z" fill="url(#bkEraserBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Pink half (soft pencil eraser) -->
    <path d="M 32 22 L 50 22 C 53 22 55 24 55 27 L 55 37 C 55 40 53 42 50 42 L 32 42 Z" fill="url(#bkEraserPink)" stroke="#be185d" stroke-width="1.5"/>
    <!-- Divider band -->
    <line x1="32" y1="22" x2="32" y2="42" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  </g>
</svg>
