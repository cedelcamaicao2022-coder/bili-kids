<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bkTableGreenTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bkTableGreenLeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <!-- Back Legs -->
  <line x1="16" y1="30" x2="14" y2="52" stroke="#065f46" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="30" x2="50" y2="52" stroke="#065f46" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Underframe Apron -->
  <rect x="11" y="27" width="42" height="6" rx="2" fill="#065f46"/>
  <!-- Front Legs -->
  <line x1="11" y1="30" x2="9" y2="58" stroke="url(#bkTableGreenLeg)" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="53" y1="30" x2="55" y2="58" stroke="url(#bkTableGreenLeg)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Tabletop 3D Edge -->
  <rect x="5" y="24" width="54" height="6" rx="3" fill="#047857"/>
  <!-- Tabletop Main Surface -->
  <rect x="4" y="17" width="56" height="11" rx="4" fill="url(#bkTableGreenTop)"/>
  <!-- Tabletop Gloss Highlight -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#d1fae5" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
</svg>
