<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" aria-label="Triceratops">
  <defs>
    <linearGradient id="triBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="triFrill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="triHorn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Tail & Body -->
  <path d="M 12 40 Q 6 42 4 48 Q 12 45 18 42 Z" fill="#047857"/>
  <ellipse cx="28" cy="38" rx="16" ry="12" fill="url(#triBody)" stroke="#065f46" stroke-width="2"/>
  <!-- Four sturdy legs -->
  <rect x="16" y="44" width="6" height="12" rx="3" fill="#047857"/>
  <rect x="25" y="44" width="6" height="12" rx="3" fill="#059669"/>
  <rect x="33" y="44" width="6" height="12" rx="3" fill="#047857"/>
  <rect x="40" y="44" width="6" height="12" rx="3" fill="#059669"/>
  <!-- Frill (Back Crest Shield) -->
  <path d="M 36 28 C 34 16, 48 10, 54 18 C 58 24, 52 32, 46 36 Z" fill="url(#triFrill)" stroke="#9a3412" stroke-width="2"/>
  <circle cx="44" cy="18" r="2" fill="#fed7aa"/>
  <circle cx="50" cy="22" r="2" fill="#fed7aa"/>
  <!-- Head -->
  <ellipse cx="44" cy="33" rx="8" ry="7" fill="url(#triBody)" stroke="#065f46" stroke-width="1.8"/>
  <!-- Snout / Beak -->
  <path d="M 48 32 L 56 36 L 48 38 Z" fill="#047857" stroke="#065f46" stroke-width="1.5"/>
  <!-- Snout Horn (Nose) -->
  <path d="M 52 34 L 56 28 L 54 35 Z" fill="url(#triHorn)" stroke="#854d0e" stroke-width="1.2"/>
  <!-- Brow Horns (Two big horns) -->
  <path d="M 43 27 Q 48 18 56 16 Q 49 24 45 28 Z" fill="url(#triHorn)" stroke="#854d0e" stroke-width="1.5"/>
  <path d="M 40 27 Q 44 20 50 18 Q 45 24 42 28 Z" fill="url(#triHorn)" stroke="#854d0e" stroke-width="1.2" opacity="0.85"/>
  <!-- Friendly Eye -->
  <circle cx="45" cy="31" r="2.2" fill="#ffffff"/>
  <circle cx="45.6" cy="31" r="1.3" fill="#0f172a"/>
  <circle cx="46" cy="30.5" r="0.5" fill="#ffffff"/>
</svg>
