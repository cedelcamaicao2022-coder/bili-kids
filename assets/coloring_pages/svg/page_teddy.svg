    <path d="M 400 445 C 385 425 355 435 365 460 C 375 480 400 500 400 500 C 400 500 425 480 435 460 C 445 435 415 425 400 445 Z" fill="#ffffff"/>
    <!-- Legs / Feet -->
    <ellipse cx="280" cy="560" rx="70" ry="50"/>
    <circle cx="280" cy="560" r="30"/>
    <ellipse cx="520" cy="560" rx="70" ry="50"/>
    <circle cx="520" cy="560" r="30"/>
