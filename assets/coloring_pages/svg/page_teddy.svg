    <circle cx="452" cy="235" r="5" fill="#ffffff" stroke="none"/>
    <!-- Arms -->
    <ellipse cx="250" cy="410" rx="45" ry="75" transform="rotate(25 250 410)"/>
    <ellipse cx="550" cy="410" rx="45" ry="75" transform="rotate(-25 550 410)"/>
