    <line x1="330" y1="570" x2="330" y2="590"/>
    <line x1="350" y1="570" x2="350" y2="590"/>
    <line x1="450" y1="570" x2="450" y2="590"/>
    <line x1="470" y1="570" x2="470" y2="590"/>
    <!-- Bone on Ground -->
    <g transform="translate(400, 600)">
      <path d="M -80 -15 C -95 -28 -110 5 -90 10 C -110 15 -95 45 -80 30 L 80 30 C 95 45 110 15 90 10 C 110 5 95 -28 80 -15 Z"/>
