    <circle cx="335" cy="228" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="455" cy="228" r="6" fill="#ffffff" stroke="none"/>
    <!-- Body -->
    <ellipse cx="400" cy="460" rx="110" ry="120"/>
