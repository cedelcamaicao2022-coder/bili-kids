<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilikids Learning Together - Plataforma de Aprendizaje</title>
  <link rel="icon" type="image/png" href="assets/home/logo_bilikids_2x.png">
  <link rel="stylesheet" href="home_styles.css">
</head>
<body>

  <!-- ========================================================================
       TOP NAVIGATION BAR
       ======================================================================== -->
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="brand-link" title="Bilikids Learning Together">
        <img src="assets/home/logo_bilikids_2x.png" alt="Bilikids Learning Together" class="brand-logo-img">
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Inicio
        </a>
        <a href="stories.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Biblioteca
        </a>
        <a href="kids.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Mi progreso
        </a>
        <a href="#favoritos" class="nav-item" onclick="alert('⭐ Tus recursos favoritos están guardados y listos para practicar.')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Favoritos
        </a>
      </nav>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="btnSearch" title="Buscar lección o tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="icon-btn has-dot" id="btnNotifications" title="Notificaciones">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>

      <div class="user-profile-btn" id="userProfile" title="Perfil de Matías">
        <img src="assets/home/avatar_matias_2x.png" alt="Matías" class="user-avatar">
        <span class="user-name">Matías</span>
        <span class="user-chevron">▼</span>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       MAIN DASHBOARD CONTENT
       ======================================================================== -->
  <main class="dashboard-container">

    <!-- HERO BANNER -->
    <section class="hero-card">
      <img src="assets/home/hero_banner_full_2x.png" alt="¡Hola Matías! ¿Qué quieres aprender hoy? - Bilikids" class="hero-full-img">
      <a href="juegos.html" class="hero-hotspot-btn" title="Explorar recursos y juegos"></a>
    </section>

    <!-- AGE CATEGORY CARDS (BABIES, TODDLERS, KIDS, TEENS) -->
    <section class="age-cards-grid" id="edades">
      <!-- 1. BABIES (3 - 5 años) -> babies.html (Aventura de Colores y Preescolar) -->
      <a href="babies.html" class="age-card" title="Entrar a BABIES (3 - 5 años)">
        <img src="assets/home/card_babies_2x.png" alt="BABIES 3 - 5 años" class="age-card-bg-img">
      </a>

      <!-- 2. TODDLERS (6 - 8 años) -> toddlers.html (Fonética, Granja y Casa) -->
      <a href="toddlers.html" class="age-card" title="Entrar a TODDLERS (6 - 8 años)">
        <img src="assets/home/card_toddlers_2x.png" alt="TODDLERS 6 - 8 años" class="age-card-bg-img">
      </a>

      <!-- 3. KIDS (9 - 11 años) -> kids.html (12 Unidades Cambridge) -->
      <a href="kids.html" class="age-card highlight" title="Entrar a KIDS (9 - 11 años) - 12 Unidades Cambridge">
        <img src="assets/home/card_kids_2x.png" alt="KIDS 9 - 11 años" class="age-card-bg-img">
      </a>

      <!-- 4. TEENS (12 - 16 años) -> teens.html (Cambridge B1-B2 & Fluidez) -->
      <a href="teens.html" class="age-card" title="Entrar a TEENS (12 - 16 años)">
        <img src="assets/home/card_teens_2x.png" alt="TEENS 12 - 16 años" class="age-card-bg-img">
      </a>
    </section>

    <!-- RESOURCES SECTION ("Explora nuestros recursos") -->
    <section id="recursos">
      <div class="section-header-row">
        <h2 class="section-title">Explora nuestros recursos</h2>
        <a href="juegos.html" class="section-link">
          Ver todos los recursos
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

      <div class="resources-grid">
        <!-- 1. Cuentos -> stories.html -->
        <a href="stories.html" class="resource-card" title="Biblioteca de Cuentos 3D en inglés">
          <img src="assets/home/res_cuentos_2x.png" alt="Cuentos" class="resource-card-img">
        </a>

        <!-- 2. Videos -> videos.html -->
        <a href="videos.html" class="resource-card" title="Teatro de Videos y Animaciones de Barnaby">
          <img src="assets/home/res_videos_2x.png" alt="Videos" class="resource-card-img">
        </a>

        <!-- 3. Canciones -> songs.html -->
        <a href="songs.html" class="resource-card" title="Jukebox de Canciones Infantiles en Inglés">
          <img src="assets/home/res_canciones_2x.png" alt="Canciones" class="resource-card-img">
        </a>

        <!-- 4. Karaoke -> karaoke.html -->
        <a href="karaoke.html" class="resource-card" title="Estudio de Karaoke Sing Together">
          <img src="assets/home/res_karaoke_2x.png" alt="Karaoke" class="resource-card-img">
        </a>

        <!-- 5. Juegos -> juegos.html -->
        <a href="juegos.html" class="resource-card" title="Sala Arcade de Videojuegos 2D">
          <img src="assets/home/res_juegos_2x.png" alt="Juegos" class="resource-card-img">
        </a>

        <!-- 6. Actividades -> actividades.html -->
        <a href="actividades.html" class="resource-card" title="Taller Creativo, Pizarra y Fichas">
          <img src="assets/home/res_actividades_2x.png" alt="Actividades" class="resource-card-img">
        </a>
      </div>
    </section>

    <!-- BOTTOM ROW: CONTINUA APRENDIENDO & MI PROGRESO -->
    <section class="bottom-modules-row">
      <!-- Col 1: Continua aprendiendo -->
      <div class="module-col">
        <div class="module-header-row">
          <h3 class="module-title">Continúa aprendiendo</h3>
          <a href="juegos.html" class="module-link-arrow" title="Ver más lecciones">→</a>
        </div>
        <div class="continue-cards-grid">
          <!-- Colors in the House -> house.html -->
          <a href="house.html" class="continue-card" title="Continuar Colors in the House">
            <img src="assets/home/continue_colors_2x.png" alt="Colors in the House" class="continue-card-img">
          </a>
          <!-- Animals on the Farm -> farm.html -->
          <a href="farm.html" class="continue-card" title="Continuar Animals on the Farm">
            <img src="assets/home/continue_animals_2x.png" alt="Animals on the Farm" class="continue-card-img">
          </a>
          <!-- My Family Story -> stories.html -->
          <a href="stories.html" class="continue-card" title="Continuar My Family Story">
            <img src="assets/home/continue_family_2x.png" alt="My Family Story" class="continue-card-img">
          </a>
          <!-- Daily Routines -> kids_unit4.html -->
          <a href="kids_unit4.html" class="continue-card" title="Continuar Daily Routines">
            <img src="assets/home/continue_routines_2x.png" alt="Daily Routines" class="continue-card-img">
          </a>
        </div>
      </div>

      <!-- Col 2: Mi progreso -->
      <div class="module-col" style="justify-content: flex-end;">
        <div class="progress-panel-wrapper">
          <a href="kids.html" style="display:block; width:100%; height:100%;" title="Ver desglose de habilidades en Kids Club">
            <img src="assets/home/panel_progreso_2x.png" alt="Mi progreso: Listening, Reading, Writing, Speaking" class="progress-panel-img">
          </a>
        </div>
      </div>
    </section>

  </main>

  <!-- ========================================================================
       INTERACTIVE MODAL POPUP
       ======================================================================== -->
  <div class="modal-overlay" id="biliModalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="biliModalTitle">Bilikids</h3>
        <button class="modal-close-btn" id="biliModalClose">×</button>
      </div>
      <div class="modal-body" id="biliModalContent">
        <!-- Dynamic content injected via JS -->
      </div>
    </div>
  </div>

  <script src="home_engine.js"></script>
</body>
</html>
