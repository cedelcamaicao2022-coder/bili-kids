<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bilikids Adventure - Plataforma de Aprendizaje Interactivo</title>
  <meta name="description" content="Plataforma de aprendizaje de inglés para niños y jóvenes con canciones interactivas, karaoke fonético, cuentos y juegos.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻</text></svg>">
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="home_styles.css?v=20261104_v2">
  <link rel="stylesheet" href="bilikids_mascot.css?v=20261102">
</head>
<body class="fullscreen-portal-body">

  <!-- ========================================================================
       FULLSCREEN IMMERSIVE ADVENTURE PORTAL (Edge-to-Edge)
       ======================================================================== -->
  <main class="portal-main-wrapper" id="portalMain">
    <div class="portal-card" id="heroBanner">
      <!-- Desktop Banner (16:9 Landscape Artwork) -->
      <picture class="portal-picture portal-picture-desktop">
        <source srcset="assets/home/hero_banner_adventure_2x.webp" type="image/webp">
        <img src="assets/home/hero_banner_adventure_2x.png" alt="Bilikids Adventure" class="portal-img portal-img-desktop" id="heroBannerDesktop" fetchpriority="high">
      </picture>
      
      <!-- Mobile Banner (Vertical Portrait Artwork matching Phone Mockup) -->
      <picture class="portal-picture portal-picture-mobile">
        <source srcset="assets/home/hero_banner_mobile_2x.webp" type="image/webp">
        <img src="assets/home/hero_banner_mobile_2x.png" alt="Bilikids Adventure" class="portal-img portal-img-mobile" id="heroBannerMobile" fetchpriority="high">
      </picture>

      <!-- Interactive Clickable Hitbox for 'Explorar ahora' -->
      <a href="juegos.html" class="hero-hitbox hero-hitbox-explorar" title="Explorar todos los recursos y actividades" aria-label="Explorar ahora">
        <span class="sr-only">Explorar ahora</span>
      </a>

      <!-- Interactive Clickable Hitboxes for Age Categories -->
      <a href="babies.html" class="hero-hitbox hero-hitbox-babies" title="Entrar a BABIES (3 - 5 años)" aria-label="Entrar a BABIES (3 - 5 años)">
        <span class="sr-only">Babies (3 - 5 años)</span>
      </a>
      <a href="toddlers.html" class="hero-hitbox hero-hitbox-toddlers" title="Entrar a TODDLERS (6 - 8 años)" aria-label="Entrar a TODDLERS (6 - 8 años)">
        <span class="sr-only">Toddlers (6 - 8 años)</span>
      </a>
      <a href="kids.html" class="hero-hitbox hero-hitbox-kids" title="Entrar a KIDS (9 - 11 años)" aria-label="Entrar a KIDS (9 - 11 años)">
        <span class="sr-only">Kids (9 - 11 años)</span>
      </a>
      <a href="teens.html" class="hero-hitbox hero-hitbox-teens" title="Entrar a TEENS (12 - 16 años)" aria-label="Entrar a TEENS (12 - 16 años)">
        <span class="sr-only">Teens (12 - 16 años)</span>
      </a>
    </div>
  </main>

  <!-- Interactive Modal Popup (Retained for future profile & notifications) -->
  <div class="modal-overlay" id="biliModalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="biliModalTitle">Bilikids</h3>
        <button class="modal-close-btn" id="biliModalClose">×</button>
      </div>
      <div class="modal-body" id="biliModalContent">
        <!-- Dynamic content injected via JS -->
      </div>
    </div>
  </div>

  <script src="home_engine.js"></script>
  <script src="mobile_audio_unlock.js"></script>
  <script src="bilikids_mascot.js?v=20261102"></script>
</body>
</html>
