<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bilikids Karaoke | Himno Oficial "You Belong"</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --accent-pink: #ec4899;
      --accent-purple: #a855f7;
      --accent-yellow: #facc15;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.18) 0%, transparent 50%);
      color: #ffffff;
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    .karaoke-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-home:hover {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
      transform: translateX(-3px);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* MAIN STAGE */
    .karaoke-main {
      max-width: 1100px;
      margin: 1.5rem auto 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage-card {
      background: linear-gradient(145deg, rgba(26, 20, 48, 0.9), rgba(16, 24, 46, 0.9));
      border: 2px solid rgba(168, 85, 247, 0.35);
      border-radius: 32px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 45px rgba(168, 85, 247, 0.2);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* MIC & TITLE */
    .mic-hero {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .mic-badge {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
      transition: transform 0.3s;
    }

    .mic-badge.pulsing {
      animation: pulse-mic 1.6s infinite ease-in-out;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
      50% { transform: scale(1.1); box-shadow: 0 0 55px rgba(236, 72, 153, 0.85); }
    }

    .song-title-main {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }

    .song-artist-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.3rem 1rem;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* TELEPROMPTER SCREEN */
    .screen-teleprompter {
      background: #060913;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 2rem;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .bouncing-star-indicator {
      position: absolute;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 20;
      filter: drop-shadow(0 0 14px #facc15);
      opacity: 0;
      will-change: transform, left, top;
    }

    .bouncing-star-indicator.active {
      opacity: 1;
    }

    .current-line-box {
      font-family: var(--font-display);
      font-size: 2.3rem;
      font-weight: 700;
      line-height: 1.4;
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      width: 100%;
      max-width: 900px;
    }

    .k-word {
      display: inline-block;
      color: rgba(255, 255, 255, 0.65);
      padding: 0.1rem 0.35rem;
      border-radius: 8px;
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease;
    }

    .k-word.active {
      color: #facc15;
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      transform: scale(1.15);
    }

    .k-word.sung {
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
    }

    .upcoming-line-box {
      font-size: 1.05rem;
      color: #64748b;
      margin-top: 1.25rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    /* AUDIO PROGRESS SCRUBBER */
    .scrubber-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .time-label {
      font-family: monospace;
      font-size: 0.95rem;
      color: #94a3b8;
      min-width: 50px;
    }

    .progress-bar-container {
      flex-grow: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #a855f7, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    }

    /* CONTROLS BAR */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-circle:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
    }

    .btn-main-play {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: none;
      color: #ffffff;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-main-play:hover {
      transform: scale(1.12);
      box-shadow: 0 12px 40px rgba(236, 72, 153, 0.75);
    }

    /* SCORE / STARS */
    .stars-rating {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.75rem;
      color: #facc15;
    }

    .score-badge {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 0.35rem 1.15rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      margin-left: 0.75rem;
    }

    @media (max-width: 768px) {
      .current-line-box { font-size: 1.6rem; }
      .song-title-main { font-size: 1.8rem; }
      .stage-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="karaoke-header">
    <a href="index.html" class="btn-back-home" title="Volver al Portal Principal">
      ← Volver al Inicio
    </a>
    <div class="brand-title">
      🎤 Bilikids <span style="color: #c084fc;">Karaoke Studio</span>
    </div>
  </header>

  <!-- MAIN STAGE -->
  <main class="karaoke-main">
    <section class="stage-card">

      <!-- MIC HERO -->
      <div class="mic-hero">
        <div class="mic-badge" id="micBadge">🎙️</div>
      </div>

      <!-- TITLE -->
      <h1 class="song-title-main">You Belong (The Bilikids Anthem)</h1>
      <div class="song-artist-badge">
        <span>⭐ Himno Oficial de Bilikids</span>
        <span>•</span>
        <span>Audio Master Original</span>
      </div>

      <!-- TELEPROMPTER SCREEN -->
      <div class="screen-teleprompter" id="teleprompter">
        <div class="bouncing-star-indicator" id="starIndicator">⭐</div>
        <div class="current-line-box" id="currentLine">
          <span class="k-word">¡Presiona</span>
          <span class="k-word">Play</span>
          <span class="k-word">para</span>
          <span class="k-word">cantar</span>
          <span class="k-word">juntos!</span>
          <span class="k-word">🎵</span>
        </div>
        <div class="upcoming-line-box" id="upcomingLine">
          Siguiente: "Hey myself, look at me..."
        </div>
      </div>

      <!-- SCRUBBER -->
      <div class="scrubber-wrapper">
        <span class="time-label" id="currentTimeLabel">0:00</span>
        <div class="progress-bar-container" id="progressBarContainer" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <span class="time-label" id="durationLabel">3:35</span>
      </div>

      <!-- CONTROLS -->
      <div class="controls-row">
        <button class="btn-circle" title="Reiniciar canción" onclick="restartAudio()">⏮</button>
        <button class="btn-circle" title="Retroceder 5 segundos" onclick="skipAudio(-5)">-5s</button>
        
        <button class="btn-main-play" id="btnPlayPause" onclick="togglePlayAudio()">▶</button>
        
        <button class="btn-circle" title="Adelantar 5 segundos" onclick="skipAudio(5)">+5s</button>
        <button class="btn-circle" id="btnMute" title="Silenciar / Activar sonido" onclick="toggleMute()">🔊</button>
      </div>

      <!-- SCORE / STARS -->
      <div class="stars-rating">
        <span id="star1">★</span>
        <span id="star2">★</span>
        <span id="star3">★</span>
        <span class="score-badge" id="scoreBadge">Puntaje: 100 Pts</span>
      </div>

    </section>
  </main>

  <!-- HTML5 REAL AUDIO ELEMENT -->
  <audio id="anthemAudio" src="assets/audio/bilikids_anthem.mp3" preload="auto"></audio>

  <script>
    // Timestamped Synced Lyrics with start and end times for word interpolation
    const lyricsData = [
      { start: 0.0,   end: 3.5,   line: "🎵 Instrumental Intro... ¡Prepárate! 🎵" },
      { start: 3.5,   end: 9.8,   line: "Hey myself, look at me ✨" },
      { start: 10.0,  end: 16.5,  line: "You are more than you can see 🌟" },
      { start: 16.5,  end: 20.8,  line: "Here at Bilikids you belong 💖" },
      { start: 20.8,  end: 25.0,  line: "You are loved, you are strong! 💪" },
      { start: 25.0,  end: 30.0,  line: "Ohhh, ohhh... 🎶" },
      { start: 30.0,  end: 33.8,  line: "Some days the sun won't shine so bright ☁️" },
      { start: 33.8,  end: 37.2,  line: "Some days you hide what's deep inside" },
      { start: 37.2,  end: 40.8,  line: "It's okay to cry, it's okay to feel 💧" },
      { start: 40.8,  end: 45.0,  line: "You don't have to hide what's real" },
      { start: 45.0,  end: 48.5,  line: "If your heart feels tired and blue 💙" },
      { start: 48.5,  end: 52.2,  line: "There is someone here for you" },
      { start: 52.2,  end: 55.8,  line: "Take my hand let's talk awhile 🤝" },
      { start: 55.8,  end: 60.5,  line: "You don't have to fake a smile 😊" },
      { start: 60.5,  end: 64.5,  line: "You are not alone, alone, alone! 🌈" },
      { start: 64.5,  end: 68.2,  line: "At Bilikids you found a home 🏡" },
      { start: 68.2,  end: 71.8,  line: "You are enough just as you are ⭐" },
      { start: 71.8,  end: 75.8,  line: "A precious life, a shining star! ✨" },
      { start: 75.8,  end: 79.2,  line: "Hand in hand we'll help you through 🤝" },
      { start: 79.2,  end: 82.8,  line: "There's a friend who cares for you 💖" },
      { start: 82.8,  end: 86.5,  line: "Bilikids, together we stand! 🏆" },
      { start: 86.5,  end: 91.0,  line: "There's always a friend to hold your hand 🌟" },
      { start: 91.0,  end: 103.5, line: "Ohhh... to hold your hand! 🎶" },
      { start: 103.5, end: 107.5, line: "Every voice deserves to be heard 🗣️" },
      { start: 107.5, end: 110.8, line: "Every heart deserves kind words ❤️" },
      { start: 110.8, end: 114.2, line: "Teachers, friends, we're here to care 🎒" },
      { start: 114.2, end: 117.8, line: "You can talk, we'll always hear 👂" },
      { start: 117.8, end: 121.2, line: "You don't need to be brave each day" },
      { start: 121.2, end: 124.8, line: "You can ask for help along the way" },
      { start: 124.8, end: 128.2, line: "There's no shame in saying 'I'm not okay' 🫂" },
      { start: 128.2, end: 133.5, line: "We'll listen to what you have to say 💬" },
      { start: 133.5, end: 137.2, line: "If you're falling we'll reach out 🤲" },
      { start: 137.2, end: 140.8, line: "If you're hurting talk it out" },
      { start: 140.8, end: 144.2, line: "One small step, one hand to hold 👣" },
      { start: 144.2, end: 147.8, line: "You are precious more than you know 💎" },
      { start: 147.8, end: 150.8, line: "Your story matters! 📖" },
      { start: 150.8, end: 153.8, line: "Your dreams matter! 🚀" },
      { start: 153.8, end: 158.5, line: "YOU MATTER, YOU MATTER! 🌟" },
      { start: 158.5, end: 162.2, line: "You are not alone, alone, alone! 🌈" },
      { start: 162.2, end: 165.8, line: "At Bilikids you found a home 🏡" },
      { start: 165.8, end: 169.2, line: "You are enough just as you are ⭐" },
      { start: 169.2, end: 172.8, line: "A precious life, a shining star! ✨" },
      { start: 172.8, end: 176.2, line: "Hand in hand we'll help you through 🤝" },
      { start: 176.2, end: 179.8, line: "There's a friend who cares for you 💖" },
      { start: 179.8, end: 183.2, line: "Bilikids, together we stand! 🏆" },
      { start: 183.2, end: 191.0, line: "There's always a friend to hold your hand 🌟" },
      { start: 191.0, end: 201.0, line: "You matter! You belong! 💫" },
      { start: 201.0, end: 215.0, line: "At Bilikids, you're never alone... 🏡💖✨" }
    ];

    const audio = document.getElementById('anthemAudio');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const micBadge = document.getElementById('micBadge');
    const teleprompter = document.getElementById('teleprompter');
    const starIndicator = document.getElementById('starIndicator');
    const currentLineEl = document.getElementById('currentLine');
    const upcomingLineEl = document.getElementById('upcomingLine');
    const progressBarFill = document.getElementById('progressBarFill');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const scoreBadge = document.getElementById('scoreBadge');
    const btnMute = document.getElementById('btnMute');

    let currentRenderedLineIdx = -1;

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderLineWords(lineStr) {
      currentLineEl.innerHTML = '';
      const words = lineStr.split(' ');
      words.forEach((w, idx) => {
        const span = document.createElement('span');
        span.className = 'k-word';
        span.id = 'kword_' + idx;
        span.textContent = w;
        currentLineEl.appendChild(span);
      });
    }

    function togglePlayAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          btnPlayPause.textContent = '⏸';
          micBadge.classList.add('pulsing');
          starIndicator.classList.add('active');
        }).catch(e => console.error(e));
      } else {
        audio.pause();
        btnPlayPause.textContent = '▶';
        micBadge.classList.remove('pulsing');
      }
    }

    function restartAudio() {
      audio.currentTime = 0;
      currentRenderedLineIdx = -1;
      if (audio.paused) togglePlayAudio();
    }

    function skipAudio(seconds) {
      audio.currentTime = Math.max(0, Math.min(audio.duration || 215, audio.currentTime + seconds));
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      btnMute.textContent = audio.muted ? '🔇' : '🔊';
    }

    function seekAudio(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = clickPos * audio.duration;
        currentRenderedLineIdx = -1;
      }
    }

    // High-performance 60fps word & star tracking animation
    function updateKaraokeFrame() {
      if (!audio.paused && !audio.ended) {
        const cur = audio.currentTime;
        const dur = audio.duration || 215;

        // Progress bar
        const pct = (cur / dur) * 100;
        progressBarFill.style.width = pct + '%';
        currentTimeLabel.textContent = formatTime(cur);

        // Find active line
        let activeLineIdx = 0;
        for (let i = 0; i < lyricsData.length; i++) {
          if (cur >= lyricsData[i].start && cur < lyricsData[i].end) {
            activeLineIdx = i;
            break;
          } else if (cur >= lyricsData[i].end) {
            activeLineIdx = i;
          }
        }

        const currentLineData = lyricsData[activeLineIdx];

        // Re-render line words if line changed
        if (currentRenderedLineIdx !== activeLineIdx) {
          currentRenderedLineIdx = activeLineIdx;
          renderLineWords(currentLineData.line);
          
          if (activeLineIdx + 1 < lyricsData.length) {
            upcomingLineEl.textContent = 'Siguiente: "' + lyricsData[activeLineIdx + 1].line.replace(/[\u{1F300}-\u{1F6FF}]/gu, '').trim() + '"';
          } else {
            upcomingLineEl.textContent = '🎉 ¡Increíble canto! ¡Eres una estrella!';
          }
        }

        // Word tracking within current line
        const words = currentLineData.line.split(' ');
        const lineDuration = Math.max(0.1, currentLineData.end - currentLineData.start);
        const lineProgress = Math.max(0, Math.min(1, (cur - currentLineData.start) / lineDuration));
        
        const activeWordIdx = Math.min(words.length - 1, Math.floor(lineProgress * words.length));
        const wordProgress = (lineProgress * words.length) - activeWordIdx;

        // Update word highlights
        for (let w = 0; w < words.length; w++) {
          const wordEl = document.getElementById('kword_' + w);
          if (wordEl) {
            if (w < activeWordIdx) {
              wordEl.className = 'k-word sung';
            } else if (w === activeWordIdx) {
              wordEl.className = 'k-word active';
            } else {
              wordEl.className = 'k-word';
            }
          }
        }

        // Position bouncing star over active word
        const targetWordEl = document.getElementById('kword_' + activeWordIdx);
        if (targetWordEl && starIndicator) {
          const wordRect = targetWordEl.getBoundingClientRect();
          const parentRect = teleprompter.getBoundingClientRect();

          // Calculate horizontal center of the target word relative to teleprompter
          const starX = (wordRect.left - parentRect.left) + (wordRect.width / 2);
          
          // Parabolic hop: jumps up mid-word and lands right on top
          const jumpArc = -Math.sin(wordProgress * Math.PI) * 22;
          const starY = (wordRect.top - parentRect.top) - 30 + jumpArc;

          starIndicator.style.left = starX + 'px';
          starIndicator.style.top = starY + 'px';
          starIndicator.style.transform = `translate(-50%, 0) rotate(${wordProgress * 180}deg)`;
          starIndicator.classList.add('active');
        }

        // Score update
        const score = Math.min(1000, Math.floor(cur * 4.5) + 100);
        scoreBadge.textContent = `Puntaje: ${score} Pts`;
      }

      requestAnimationFrame(updateKaraokeFrame);
    }

    // Start 60fps tracking loop
    requestAnimationFrame(updateKaraokeFrame);

    audio.addEventListener('loadedmetadata', () => {
      durationLabel.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      btnPlayPause.textContent = '▶';
      micBadge.classList.remove('pulsing');
      starIndicator.classList.remove('active');
      currentLineEl.innerHTML = '<span class="k-word active">🌟 ¡Felicidades! Completaste el Himno de Bilikids 🌟</span>';
      upcomingLineEl.textContent = '¡Presiona Play para cantar de nuevo!';
    });
  </script>
</body>
</html>
