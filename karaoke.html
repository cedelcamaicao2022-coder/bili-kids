  <style>
    :root {
      --bg-dark: #0a0f1d;
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --accent-pink: #ec4899;
      --accent-purple: #a855f7;
      --accent-yellow: #facc15;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.18) 0%, transparent 50%);
      color: #ffffff;
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    .karaoke-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-home:hover {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
      transform: translateX(-3px);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* MAIN CONTAINER */
    .karaoke-main {
      max-width: 1160px;
      margin: 1.5rem auto 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    /* ==========================================================================
       SONG SELECTOR PLAYLIST
       ========================================================================== */
    .song-selector-section {
      width: 100%;
      background: rgba(19, 28, 49, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 1.5rem;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
    }

    .selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .selector-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .selector-count {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #e9d5ff;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .songs-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.85rem;
      width: 100%;
    }

    @media (max-width: 1050px) {
      .songs-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .songs-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .song-card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.15rem 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .song-card.active {
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.25));
      border-color: #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.4), inset 0 0 15px rgba(250, 204, 21, 0.15);
      transform: scale(1.02);
    }

    .song-card-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 0.65rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    .song-card:hover .song-card-badge {
      transform: scale(1.1) rotate(6deg);
    }

    .song-card-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 0.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5em;
    }

    .song-card-artist {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 0.65rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .song-card-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;

      background: #facc15;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(250, 204, 21, 0.5);
    }

       STAGE CARD (KARAOKE PLAYER)
       ========================================================================== */

      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;

      position: relative;
      margin-bottom: 1rem;
    }

    .mic-badge {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.75rem;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
      transition: all 0.3s;
    }

    .mic-badge.pulsing {
      animation: pulse-mic 1.6s infinite ease-in-out;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
      50% { transform: scale(1.1); box-shadow: 0 0 55px rgba(236, 72, 153, 0.85); }

    .song-title-main {
      font-family: var(--font-display);
      font-size: 2.25rem;
      color: #ffffff;
      margin-bottom: 0.35rem;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
      transition: all 0.25s ease;

    .song-artist-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.35rem 1.15rem;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.88rem;
      margin-bottom: 1.75rem;

    .screen-teleprompter {
      background: #060913;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);

      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 1.75rem;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);

      position: absolute;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 20;
      filter: drop-shadow(0 0 14px #facc15);
      opacity: 0;
      will-change: transform, left, top;
      transition: opacity 0.2s ease;
    }

    .bouncing-star-indicator.active {

    }

    .current-line-box {

      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.4;
      min-height: 75px;

      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      width: 100%;

    .k-word {

      color: rgba(255, 255, 255, 0.65);
      padding: 0.1rem 0.35rem;
      border-radius: 8px;
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease;

    .k-word.active {

      text-shadow: 0 0 18px rgba(250, 204, 21, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      transform: scale(1.15);
    }

    .k-word.sung {

      text-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
    }

    .upcoming-line-box {
      font-size: 1.05rem;
      color: #64748b;
      margin-top: 1.25rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    /* AUDIO PROGRESS SCRUBBER */
    .scrubber-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .time-label {
      font-family: monospace;
      font-size: 0.95rem;
      color: #94a3b8;
      min-width: 50px;
    }

    .progress-bar-container {
      flex-grow: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #a855f7, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
    }

    /* CONTROLS BAR */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .btn-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-circle:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
    }

    .btn-main-play {

      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: none;
      color: #ffffff;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

    .btn-main-play:hover {
      transform: scale(1.12);
      box-shadow: 0 12px 40px rgba(236, 72, 153, 0.75);

      align-items: center;
      gap: 0.5rem;

      .song-title-main { font-size: 1.7rem; }
      .stage-card { padding: 1.5rem 1rem; }

  </style>

  <script>
    // Audio synthesizer for UI pops
    class UIAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      pop() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }
      sparkle() {
        try {
          this.init();
          if (!this.ctx) return;
          [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = f;
            const start = this.ctx.currentTime + idx * 0.05;
            gain.gain.setValueAtTime(0.08, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.18);
          });
        } catch(e) {}
      }
    }

    let currentSongIndex = 0;
    let activeLyrics = songsCatalog[0].lyrics;
    let currentRenderedLineIdx = -1;

    // DOM Elements
    const audio = document.getElementById('anthemAudio');
    const songTitleEl = document.getElementById('songTitle');
    const songArtistBadgeEl = document.getElementById('songArtistBadge');
    const micBadge = document.getElementById('micBadge');
    const teleprompter = document.getElementById('teleprompter');
    const starIndicator = document.getElementById('starIndicator');
    const currentLineEl = document.getElementById('currentLine');
    const upcomingLineEl = document.getElementById('upcomingLine');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnMute = document.getElementById('btnMute');
    const progressBarFill = document.getElementById('progressBarFill');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const scoreBadge = document.getElementById('scoreBadge');
    const songsGrid = document.getElementById('songsGrid');

    // Build Song Playlist Grid
    function renderPlaylistGrid() {
      songsGrid.innerHTML = '';
      songsCatalog.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = `song-card ${idx === currentSongIndex ? 'active' : ''}`;
        card.id = `songCard_${idx}`;
        card.onclick = () => selectSong(idx);

        card.innerHTML = `
          <div class="song-card-badge" style="background: ${song.badgeGradient};">${song.icon}</div>
          <div class="song-card-title" title="${song.title}">${song.title}</div>
          <div class="song-card-artist">${song.subtitle.split('•')[0].trim()}</div>
          <span class="song-card-pill">
            ${idx === currentSongIndex ? '🎙️ Cantando' : '⏱ ' + song.durationDefault}
          </span>
        `;
        songsGrid.appendChild(card);
      });
    }

    // Select Song
    function selectSong(index) {
      if (index === currentSongIndex && !audio.paused) return;
      uiAudio.sparkle();
      
      currentSongIndex = index;
      const song = songsCatalog[index];
      activeLyrics = song.lyrics;

      // Update UI Header & Stage
      songTitleEl.textContent = song.title;
      songArtistBadgeEl.innerHTML = `
        <span>${song.subtitle}</span>
      `;
      micBadge.textContent = song.icon;
      micBadge.style.background = song.badgeGradient;

      // Load new audio
      audio.pause();
      audio.src = song.src;
      audio.currentTime = 0;
      currentRenderedLineIdx = -1;

      // Reset Teleprompter
      currentLineEl.innerHTML = `
        <span class="k-word">¡Presiona</span>
        <span class="k-word">Play</span>
        <span class="k-word">para</span>
        <span class="k-word">cantar</span>
        <span class="k-word">juntos!</span>
        <span class="k-word">${song.icon}</span>
      `;
      if (song.lyrics.length > 1) {
        upcomingLineEl.textContent = 'Siguiente: "' + song.lyrics[1].line.replace(/[\u{1F300}-\u{1F6FF}]/gu, '').trim() + '"';
      } else {
        upcomingLineEl.textContent = '';
      }

      // Reset controls
      btnPlayPause.textContent = '▶';
      micBadge.classList.remove('pulsing');
      starIndicator.classList.remove('active');
      progressBarFill.style.width = '0%';
      currentTimeLabel.textContent = '0:00';
      durationLabel.textContent = song.durationDefault;
      scoreBadge.textContent = 'Puntaje: 100 Pts';

      // Update playlist cards highlight
      document.querySelectorAll('.song-card').forEach((c, idx) => {
        if (idx === index) {
          c.classList.add('active');
          const pill = c.querySelector('.song-card-pill');
          if (pill) pill.textContent = '🎙️ Cantando';
        } else {
          c.classList.remove('active');
          const pill = c.querySelector('.song-card-pill');
          if (pill) pill.textContent = '⏱ ' + songsCatalog[idx].durationDefault;
        }
      });
    }

    // Render single line words
    function renderLineWords(lineText) {
      currentLineEl.innerHTML = '';
      const words = lineText.split(' ');
      words.forEach((w, idx) => {
        const span = document.createElement('span');
        span.className = 'k-word';
        span.id = 'kword_' + idx;
        span.textContent = w;
        currentLineEl.appendChild(span);
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function togglePlayAudio() {
      uiAudio.pop();
      if (audio.paused) {
        audio.play().then(() => {
          btnPlayPause.textContent = '⏸';
          micBadge.classList.add('pulsing');
        }).catch(e => {
          console.warn('Audio play request failed:', e);
        });
      } else {
        audio.pause();
        btnPlayPause.textContent = '▶';
        micBadge.classList.remove('pulsing');
      }
    }

    function restartAudio() {
      uiAudio.pop();
      audio.currentTime = 0;
      currentRenderedLineIdx = -1;
      if (audio.paused) togglePlayAudio();
    }

    function skipAudio(seconds) {
      uiAudio.pop();
      audio.currentTime = Math.max(0, Math.min(audio.duration || 9999, audio.currentTime + seconds));
      currentRenderedLineIdx = -1;
    }

    function toggleMute() {
      uiAudio.pop();
      audio.muted = !audio.muted;
      btnMute.textContent = audio.muted ? '🔇' : '🔊';
    }

    function seekAudio(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = clickPos * audio.duration;
        currentRenderedLineIdx = -1;
        updateKaraokeFrame(true);
      }
    }

    // High-performance 60fps word & star tracking animation
    function updateKaraokeFrame(force = false) {
      const isForced = (force === true);
      if (isForced || (!audio.paused && !audio.ended)) {
        const cur = audio.currentTime;
        const dur = audio.duration || 180;

        // Progress bar
        const pct = (cur / dur) * 100;
        progressBarFill.style.width = pct + '%';
        currentTimeLabel.textContent = formatTime(cur);

        // Find active line with precision
        let activeLineIdx = 0;
        for (let i = 0; i < activeLyrics.length; i++) {
          if (cur >= activeLyrics[i].start && cur < activeLyrics[i].end) {
            activeLineIdx = i;
            break;
          } else if (cur >= activeLyrics[i].end) {
            activeLineIdx = i;
          }
        }

        const currentLineData = activeLyrics[activeLineIdx] || activeLyrics[0];

        // Re-render line words if line changed
        if (currentRenderedLineIdx !== activeLineIdx && currentLineData) {
          currentRenderedLineIdx = activeLineIdx;
          renderLineWords(currentLineData.line);
          
          if (activeLineIdx + 1 < activeLyrics.length) {
            upcomingLineEl.textContent = 'Siguiente: "' + activeLyrics[activeLineIdx + 1].line.replace(/[\u{1F300}-\u{1F6FF}]/gu, '').trim() + '"';
          } else {
            upcomingLineEl.textContent = '🎉 ¡Increíble canto! ¡Eres una estrella!';
          }
        }

        // Word tracking within current line
        if (currentLineData) {
          const isInstrumental = currentLineData.line.startsWith('🎵') || currentLineData.line.startsWith('🎉') || currentLineData.line.startsWith('🌙');
          
          if (isInstrumental) {
            // Instrumental or outro: highlight softly and park bouncing star
            const words = currentLineData.line.split(' ');
            for (let w = 0; w < words.length; w++) {
              const wordEl = document.getElementById('kword_' + w);
              if (wordEl) wordEl.className = 'k-word sung';
            }
            if (starIndicator) {
              starIndicator.classList.remove('active');
            }
          } else {
            const words = currentLineData.line.split(' ');
            const lineDuration = Math.max(0.1, currentLineData.end - currentLineData.start);
            const lineProgress = Math.max(0, Math.min(1, (cur - currentLineData.start) / lineDuration));
            
            const activeWordIdx = Math.min(words.length - 1, Math.floor(lineProgress * words.length));
            const wordProgress = (lineProgress * words.length) - activeWordIdx;

            // Update word highlights
            for (let w = 0; w < words.length; w++) {
              const wordEl = document.getElementById('kword_' + w);
              if (wordEl) {
                if (w < activeWordIdx) {
                  wordEl.className = 'k-word sung';
                } else if (w === activeWordIdx) {
                  wordEl.className = 'k-word active';
                } else {
                  wordEl.className = 'k-word';
                }
              }
            }

            // Position bouncing star over active word
            const targetWordEl = document.getElementById('kword_' + activeWordIdx);
            if (targetWordEl && starIndicator) {
              const wordRect = targetWordEl.getBoundingClientRect();
              const parentRect = teleprompter.getBoundingClientRect();

              const starX = (wordRect.left - parentRect.left) + (wordRect.width / 2);
              const jumpArc = -Math.sin(wordProgress * Math.PI) * 22;
              const starY = (wordRect.top - parentRect.top) - 30 + jumpArc;

              starIndicator.style.left = starX + 'px';
              starIndicator.style.top = starY + 'px';
              starIndicator.style.transform = `translate(-50%, 0) rotate(${wordProgress * 180}deg)`;
              starIndicator.classList.add('active');
            }
          }
        }

        // Score update
        const score = Math.min(1000, Math.floor(cur * 5.2) + 100);
        scoreBadge.textContent = `Puntaje: ${score} Pts`;
      }

      requestAnimationFrame(updateKaraokeFrame);
    }

    // Start 60fps tracking loop
    requestAnimationFrame(updateKaraokeFrame);

    audio.addEventListener('loadedmetadata', () => {
      durationLabel.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('seeked', () => {
      currentRenderedLineIdx = -1;
      updateKaraokeFrame(true);
    });

    audio.addEventListener('ended', () => {
      btnPlayPause.textContent = '▶';
      micBadge.classList.remove('pulsing');
      starIndicator.classList.remove('active');
      currentLineEl.innerHTML = `<span class="k-word active">🌟 ¡Felicidades! Completaste "${songsCatalog[currentSongIndex].title}" 🌟</span>`;
      upcomingLineEl.textContent = '¡Presiona Play para cantar de nuevo o elige otra canción!';
      uiAudio.sparkle();
    });

    // Initialize playlist on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      renderPlaylistGrid();
      selectSong(0);
    });
  </script>
