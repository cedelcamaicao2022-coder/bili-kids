<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bilikids Karaoke | Sing Together Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0c1322;
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --accent-purple: #c084fc;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(192, 132, 252, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.15) 0%, transparent 45%);
      color: #ffffff;
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .karaoke-header {
      background: rgba(19, 28, 49, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-home:hover {
      background: var(--accent-purple);
      color: #000;
      border-color: var(--accent-purple);
      transform: translateX(-3px);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .karaoke-stage {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2.5rem;
      background: rgba(26, 38, 64, 0.9);
      border: 2px solid rgba(192, 132, 252, 0.4);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(192, 132, 252, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
    }

    .mic-icon-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      animation: mic-pulse 2s infinite ease-in-out;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .stage-title {
      font-family: var(--font-display);
      font-size: 2.4rem;
      color: #fff;
      margin-bottom: 0.35rem;
    }

    .stage-subtitle {
      color: var(--accent-purple);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .teleprompter-box {
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 2rem;
    }

    .bouncing-ball {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background: #facc15;
      border-radius: 50%;
      box-shadow: 0 0 12px #facc15;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .karaoke-text {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: #ffffff;
      line-height: 1.4;
      transition: color 0.25s;
    }

    .karaoke-text .word.sung {
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
    }

    .karaoke-controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .btn-sing {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: none;
      color: #fff;
      font-family: var(--font-main);
      font-size: 1.2rem;
      font-weight: 700;
      padding: 0.85rem 2.5rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(236, 72, 153, 0.45);
      transition: all 0.2s ease;
    }

    .btn-sing:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.6);
    }

    .stars-score {
      margin-top: 1.5rem;
      font-size: 2rem;
      color: #facc15;
      letter-spacing: 6px;
    }
  </style>
</head>
<body>

  <header class="karaoke-header">
    <a href="index.html" class="btn-back-home" title="Volver al Portal Principal">
      ← Volver al Inicio
    </a>
    <div class="brand-title">
      🎤 Bilikids <span style="color: #c084fc;">Karaoke</span>
    </div>
  </header>

  <main style="display:flex; justify-content:center; align-items:center; flex-grow:1;">
    <section class="karaoke-stage">
      <div class="mic-icon-wrapper">🎙️</div>
      <h1 class="stage-title">Sing Together Studio ✨</h1>
      <p class="stage-subtitle">¡Canta con la letra en pantalla y mejora tu pronunciación en inglés!</p>

      <div class="teleprompter-box">
        <div class="bouncing-ball" id="bouncingBall"></div>
        <div class="karaoke-text" id="karaokeLyrics">
          <span class="word">"I</span>
          <span class="word">love</span>
          <span class="word">to</span>
          <span class="word">sing</span>
          <span class="word">in</span>
          <span class="word">English</span>
          <span class="word">every</span>
          <span class="word">day!"</span>
        </div>
      </div>

      <div class="karaoke-controls">
        <button class="btn-sing" id="btnStartKaraoke" onclick="toggleKaraoke()">▶ Iniciar Karaoke</button>
      </div>

      <div class="stars-score" id="starsScore">★★★</div>
    </section>
  </main>

  <script>
    let isSinging = false;
    let timer = null;
    let wordIndex = 0;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    function toggleKaraoke() {
      initAudio();
      isSinging = !isSinging;
      const btn = document.getElementById('btnStartKaraoke');
      btn.textContent = isSinging ? '⏸ Pausar' : '▶ Iniciar Karaoke';

      if (isSinging) {
        stepKaraoke();
      } else {
        clearTimeout(timer);
      }
    }

    const freqs = [392, 440, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99];

    function stepKaraoke() {
      if (!isSinging) return;
      const words = document.querySelectorAll('#karaokeLyrics .word');
      words.forEach((w, i) => {
        w.classList.toggle('sung', i <= wordIndex);
      });

      const ball = document.getElementById('bouncingBall');
      const targetWord = words[wordIndex % words.length];
      if (targetWord) {
        const offsetLeft = targetWord.offsetLeft + (targetWord.offsetWidth / 2);
        ball.style.left = offsetLeft + 'px';
      }

      playBeep(freqs[wordIndex % freqs.length]);

      wordIndex++;
      if (wordIndex >= words.length) {
        wordIndex = 0;
      }
      timer = setTimeout(stepKaraoke, 650);
    }
  </script>
</body>
</html>
