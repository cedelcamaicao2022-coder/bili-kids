<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bilikids Karaoke | Himno Oficial "You Belong"</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --accent-pink: #ec4899;
      --accent-purple: #a855f7;
      --accent-yellow: #facc15;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.18) 0%, transparent 50%);
      color: #ffffff;
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    .karaoke-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-home:hover {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
      transform: translateX(-3px);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* MAIN STAGE */
    .karaoke-main {
      max-width: 1100px;
      margin: 1.5rem auto 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage-card {
      background: linear-gradient(145deg, rgba(26, 20, 48, 0.9), rgba(16, 24, 46, 0.9));
      border: 2px solid rgba(168, 85, 247, 0.35);
      border-radius: 32px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 45px rgba(168, 85, 247, 0.2);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* MIC & TITLE */
    .mic-hero {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .mic-badge {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
      transition: transform 0.3s;
    }

    .mic-badge.pulsing {
      animation: pulse-mic 1.6s infinite ease-in-out;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
      50% { transform: scale(1.1); box-shadow: 0 0 55px rgba(236, 72, 153, 0.85); }
    }

    .song-title-main {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }

    .song-artist-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.3rem 1rem;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* TELEPROMPTER SCREEN */
    .screen-teleprompter {
      background: #060913;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 2rem;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .bouncing-star-indicator {
      position: absolute;
      top: 18px;
      font-size: 1.8rem;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 10px #facc15);
      opacity: 0;
    }

    .bouncing-star-indicator.active {
      opacity: 1;
      animation: star-hop 0.8s infinite ease-in-out;
    }

    @keyframes star-hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .current-line-box {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 700;
      color: #facc15;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
      line-height: 1.35;
      transition: all 0.3s ease;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upcoming-line-box {
      font-size: 1.05rem;
      color: #64748b;
      margin-top: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    /* AUDIO PROGRESS SCRUBBER */
    .scrubber-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .time-label {
      font-family: monospace;
      font-size: 0.95rem;
      color: #94a3b8;
      min-width: 50px;
    }

    .progress-bar-container {
      flex-grow: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #a855f7, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
      transition: width 0.1s linear;
    }

    /* CONTROLS BAR */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-circle:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
    }

    .btn-main-play {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: none;
      color: #ffffff;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-main-play:hover {
      transform: scale(1.12);
      box-shadow: 0 12px 40px rgba(236, 72, 153, 0.75);
    }

    /* SCORE / STARS */
    .stars-rating {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.75rem;
      color: #facc15;
    }

    .score-badge {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 0.35rem 1.15rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      margin-left: 0.75rem;
    }

    @media (max-width: 768px) {
      .current-line-box { font-size: 1.6rem; }
      .song-title-main { font-size: 1.8rem; }
      .stage-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="karaoke-header">
    <a href="index.html" class="btn-back-home" title="Volver al Portal Principal">
      ← Volver al Inicio
    </a>
    <div class="brand-title">
      🎤 Bilikids <span style="color: #c084fc;">Karaoke Studio</span>
    </div>
  </header>

  <!-- MAIN STAGE -->
  <main class="karaoke-main">
    <section class="stage-card">

      <!-- MIC HERO -->
      <div class="mic-hero">
        <div class="mic-badge" id="micBadge">🎙️</div>
      </div>

      <!-- TITLE -->
      <h1 class="song-title-main">You Belong (The Bilikids Anthem)</h1>
      <div class="song-artist-badge">
        <span>⭐ Himno Oficial de Bilikids</span>
        <span>•</span>
        <span>Audio Master Original</span>
      </div>

      <!-- TELEPROMPTER SCREEN -->
      <div class="screen-teleprompter" id="teleprompter">
        <div class="bouncing-star-indicator" id="starIndicator">⭐</div>
        <div class="current-line-box" id="currentLine">
          ¡Presiona Play para cantar juntos! 🎵
        </div>
        <div class="upcoming-line-box" id="upcomingLine">
          Siguiente: "Hey myself, look at me..."
        </div>
      </div>

      <!-- SCRUBBER -->
      <div class="scrubber-wrapper">
        <span class="time-label" id="currentTimeLabel">0:00</span>
        <div class="progress-bar-container" id="progressBarContainer" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <span class="time-label" id="durationLabel">3:35</span>
      </div>

      <!-- CONTROLS -->
      <div class="controls-row">
        <button class="btn-circle" title="Reiniciar canción" onclick="restartAudio()">⏮</button>
        <button class="btn-circle" title="Retroceder 5 segundos" onclick="skipAudio(-5)">-5s</button>
        
        <button class="btn-main-play" id="btnPlayPause" onclick="togglePlayAudio()">▶</button>
        
        <button class="btn-circle" title="Adelantar 5 segundos" onclick="skipAudio(5)">+5s</button>
        <button class="btn-circle" id="btnMute" title="Silenciar / Activar sonido" onclick="toggleMute()">🔊</button>
      </div>

      <!-- SCORE / STARS -->
      <div class="stars-rating">
        <span id="star1">★</span>
        <span id="star2">★</span>
        <span id="star3">★</span>
        <span class="score-badge" id="scoreBadge">Puntaje: 100 Pts</span>
      </div>

    </section>
  </main>

  <!-- HTML5 REAL AUDIO ELEMENT -->
  <audio id="anthemAudio" src="assets/audio/bilikids_anthem.mp3" preload="auto"></audio>

  <script>
    // Timestamped Synced Lyrics matching the official Bilikids anthem
    const lyricsData = [
      { time: 0.0,   line: "🎵 Instrumental Intro... ¡Prepárate! 🎵" },
      { time: 3.5,   line: "Hey myself, look at me ✨" },
      { time: 10.5,  line: "You are more than you can see 🌟" },
      { time: 17.0,  line: "Here at Bilikids you belong 💖" },
      { time: 21.0,  line: "You are loved, you are strong! 💪" },
      { time: 25.0,  line: "Ohhh, ohhh... 🎶" },
      { time: 30.5,  line: "Some days the sun won't shine so bright ☁️" },
      { time: 34.0,  line: "Some days you hide what's deep inside" },
      { time: 37.5,  line: "It's okay to cry, it's okay to feel 💧" },
      { time: 41.0,  line: "You don't have to hide what's real" },
      { time: 45.2,  line: "If your heart feels tired and blue 💙" },
      { time: 48.8,  line: "There is someone here for you" },
      { time: 52.5,  line: "Take my hand let's talk awhile 🤝" },
      { time: 56.0,  line: "You don't have to fake a smile 😊" },
      { time: 61.0,  line: "You are not alone, alone, alone! 🌈" },
      { time: 65.0,  line: "At Bilikids you found a home 🏡" },
      { time: 68.5,  line: "You are enough just as you are ⭐" },
      { time: 72.0,  line: "A precious life, a shining star! ✨" },
      { time: 76.0,  line: "Hand in hand we'll help you through 🤝" },
      { time: 79.5,  line: "There's a friend who cares for you 💖" },
      { time: 83.0,  line: "Bilikids, together we stand! 🏆" },
      { time: 86.8,  line: "There's always a friend to hold your hand 🌟" },
      { time: 91.0,  line: "Ohhh... to hold your hand! 🎶" },
      { time: 104.0, line: "Every voice deserves to be heard 🗣️" },
      { time: 108.0, line: "Every heart deserves kind words ❤️" },
      { time: 111.0, line: "Teachers, friends, we're here to care 🎒" },
      { time: 114.5, line: "You can talk, we'll always hear 👂" },
      { time: 118.0, line: "You don't need to be brave each day" },
      { time: 121.5, line: "You can ask for help along the way" },
      { time: 125.0, line: "There's no shame in saying 'I'm not okay' 🫂" },
      { time: 128.5, line: "We'll listen to what you have to say 💬" },
      { time: 134.0, line: "If you're falling we'll reach out 🤲" },
      { time: 137.5, line: "If you're hurting talk it out" },
      { time: 141.0, line: "One small step, one hand to hold 👣" },
      { time: 144.5, line: "You are precious more than you know 💎" },
      { time: 148.0, line: "Your story matters! 📖" },
      { time: 151.0, line: "Your dreams matter! 🚀" },
      { time: 154.0, line: "YOU MATTER, YOU MATTER! 🌟" },
      { time: 159.0, line: "You are not alone, alone, alone! 🌈" },
      { time: 162.5, line: "At Bilikids you found a home 🏡" },
      { time: 166.0, line: "You are enough just as you are ⭐" },
      { time: 169.5, line: "A precious life, a shining star! ✨" },
      { time: 173.0, line: "Hand in hand we'll help you through 🤝" },
      { time: 176.5, line: "There's a friend who cares for you 💖" },
      { time: 180.0, line: "Bilikids, together we stand! 🏆" },
      { time: 183.5, line: "There's always a friend to hold your hand 🌟" },
      { time: 193.0, line: "You matter! You belong! 💫" },
      { time: 202.0, line: "At Bilikids, you're never alone... 🏡💖✨" }
    ];

    const audio = document.getElementById('anthemAudio');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const micBadge = document.getElementById('micBadge');
    const starIndicator = document.getElementById('starIndicator');
    const currentLineEl = document.getElementById('currentLine');
    const upcomingLineEl = document.getElementById('upcomingLine');
    const progressBarFill = document.getElementById('progressBarFill');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const scoreBadge = document.getElementById('scoreBadge');
    const btnMute = document.getElementById('btnMute');

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function togglePlayAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          btnPlayPause.textContent = '⏸';
          micBadge.classList.add('pulsing');
          starIndicator.classList.add('active');
        }).catch(e => console.error(e));
      } else {
        audio.pause();
        btnPlayPause.textContent = '▶';
        micBadge.classList.remove('pulsing');
        starIndicator.classList.remove('active');
      }
    }

    function restartAudio() {
      audio.currentTime = 0;
      if (audio.paused) togglePlayAudio();
    }

    function skipAudio(seconds) {
      audio.currentTime = Math.max(0, Math.min(audio.duration || 215, audio.currentTime + seconds));
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      btnMute.textContent = audio.muted ? '🔇' : '🔊';
    }

    function seekAudio(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = clickPos * audio.duration;
      }
    }

    // Update synced lyrics in real-time
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 215;

      // Update progress bar
      const pct = (cur / dur) * 100;
      progressBarFill.style.width = pct + '%';
      currentTimeLabel.textContent = formatTime(cur);

      // Find current lyric index
      let activeIdx = 0;
      for (let i = 0; i < lyricsData.length; i++) {
        if (cur >= lyricsData[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }

      currentLineEl.textContent = lyricsData[activeIdx].line;
      if (activeIdx + 1 < lyricsData.length) {
        upcomingLineEl.textContent = 'Siguiente: "' + lyricsData[activeIdx + 1].line.replace(/[\u{1F300}-\u{1F6FF}]/gu, '') + '"';
      } else {
        upcomingLineEl.textContent = '🎉 ¡Increíble canto! ¡Eres una estrella!';
      }

      // Dynamic score
      const score = Math.min(1000, Math.floor(cur * 4.5) + 100);
      scoreBadge.textContent = `Puntaje: ${score} Pts`;
    });

    audio.addEventListener('loadedmetadata', () => {
      durationLabel.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      btnPlayPause.textContent = '▶';
      micBadge.classList.remove('pulsing');
      starIndicator.classList.remove('active');
      currentLineEl.textContent = '🌟 ¡Felicidades! Completaste el Himno de Bilikids 🌟';
      upcomingLineEl.textContent = '¡Presiona Play para cantar de nuevo!';
    });
  </script>
</body>
</html>
